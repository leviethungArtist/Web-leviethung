<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lê Viết Hưng | Official Website</title>
    <style>
        /* GIAO DIỆN NGHỆ SĨ TỐI GIẢN & SANG TRỌNG */
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
        }
        .container { max-width: 450px; margin: auto; }
        
        /* Ảnh đại diện lấy từ file bạn đã tải lên GitHub */
        .profile-img { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            border: 3px solid #ff3e3e; 
            margin: 30px 0 10px; 
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 62, 62, 0.4);
        }

        h1 { font-size: 28px; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }
        .sub-title { color: #888; margin-bottom: 35px; font-size: 15px; letter-spacing: 1px; }

        /* Các khối nội dung */
        .card { 
            background: #111; 
            border-radius: 20px; 
            padding: 12px; 
            margin-bottom: 25px; 
            border: 1px solid #222; 
        }
        .card-label { font-size: 11px; color: #555; text-align: left; margin: 0 0 10px 10px; letter-spacing: 1px; }

        /* Nút bấm liên kết */
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
            border-radius: 15px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-top: 12px; 
            color: #fff; 
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        .btn-facebook { background: #1877F2; }
        .btn-tiktok { background: #000; border: 1px solid #fff; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

        iframe { border-radius: 12px; width: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <img src="Hình ảnh PNG.png" alt="Lê Viết Hưng" class="profile-img">
        
        <h1>LÊ VIẾT HƯNG</h1>
        <p class="sub-title">Nghệ Sĩ Độc Lập / Music Producer</p>

        <div class="card">
            <p class="card-label">ÂM NHẠC TRÊN SPOTIFY</p>
            <iframe src="https://open.spotify.com/artist/123abc" height="152" allow="encrypted-media"></iframe>
        </div>

        <div class="card">
            <p class="card-label">VIDEO MỚI NHẤT</p>
            <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden;">
                <iframe style="position:absolute; top:0; left:0; width:100%; height:100%;" src="https://www.youtube.com/embed?listType=user_uploads&list=leviethung.official"></iframe>
            </div>
        </div>

        <a href="https://www.facebook.com/share/1F8hAhEm78/?mibextid=wwXIfr" class="btn btn-facebook">
            Kết nối qua Facebook
        </a>

        <a href="https://www.instagram.com/leviethungartist?igsh=MXVxeHVkZXF4Z3Z1bw%3D%3D&utm_source=qr" class="btn btn-instagram">
            Theo dõi trên Instagram
        </a>

        <a href="https://www.tiktok.com/@lvhung.official" class="btn btn-tiktok">
            Theo dõi trên TikTok
        </a>

        <p style="margin-top: 60px; color: #333; font-size: 10px; letter-spacing: 3px;">© 2026 LE VIET HUNG MUSIC</p>
    </div>

</body>
</html>
